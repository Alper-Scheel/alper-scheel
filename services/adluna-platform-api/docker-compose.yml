# AdLuna Platform API — lokaler Dev-Stack
#
# Produktivbetrieb auf MS512 läuft ohne Compose als launchd-Service
# (siehe deploy-platform-api.sh). Diese Compose-Datei dient ausschließlich
# dem lokalen Testen/Debugging.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adluna-platform-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LICENSE_SERVER_ENV: development
      LICENSE_SERVER_BIND_HOST: 0.0.0.0
      LICENSE_SERVER_PORT: 8080
      LICENSE_SERVER_DB_PATH: /data/license.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; r=httpx.get('http://127.0.0.1:8080/health',timeout=3); sys.exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
